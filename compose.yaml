services:
  api:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 43100
      DATABASE_URL: postgresql://stratafetch:stratafetch@postgres:5432/stratafetch
      REDIS_URL: redis://redis:6379
    ports:
      - "43100:43100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: node apps/api/dist/worker.js
    environment:
      DATABASE_URL: postgresql://stratafetch:stratafetch@postgres:5432/stratafetch
      REDIS_URL: redis://redis:6379
      COLLECTION_DELAY_MS: 250
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stratafetch
      POSTGRES_USER: stratafetch
      POSTGRES_PASSWORD: stratafetch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratafetch -d stratafetch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
